<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Planificador de Compras</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>

<body class="bg-zinc-950 text-white">

    <div id="app">

        <!-- Header -->
        <header class="p-6">
            <!-- Titulo -->
            <h1 class="text-center text-3xl font-bold">Planificador de Compras</h1>
            <!-- Subtitulo -->
            <p class="text-center text-zinc-400 mt-2">By Sam</p>

            <!-- Seleccionar cantidad de personas -->
            <div class="flex items-center justify-center gap-3 mt-4">
                <span class="text-zinc-400">Personas</span>

                <button id="people-minus" class="bg-zinc-900 hover:bg-zinc-700 w-8 h-8 rounded-lg">-</button>

                <span id="people-count">4</span>

                <button id="people-plus" class="bg-zinc-900 hover:bg-zinc-700 w-8 h-8 rounded-lg">+</button>
            </div>
        </header>

        <!-- Cards -->
        <main id="products" class="max-w-7xl mx-auto px-4 pb-44 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Las tarjetas se insertan desde TypeScript -->
        </main>

        <!-- Drawer -->
        <aside id="drawer" class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 shadow-2xl z-50">

            <div class="max-w-7xl mx-auto p-4">

                <!-- Resumen -->
                <div class="flex justify-between items-center">

                    <div>

                        <p class="text-zinc-400 text-sm">Total del carrito</p>

                        <p id="cart-total" class="text-2xl font-bold">ARS$ 0</p>

                    </div>

                    <button id="toggle-cart" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl transition">Ver detalles</button>

                </div>

                <!-- Drawer expandido -->
                <div id="cart-content" class="hidden mt-4">

                    <!-- Visualización de items del carrito -->
                    <div id="cart-items" class="space-y-2 max-h-[15vh] overflow-y-auto pr-2"></div>

                    <div class="border-t border-zinc-700 mt-4 pt-4 space-y-2">

                        <!-- Visualización de Porciones, Comidas y dias -->
                        <div class="flex justify-between">
                            <span>Porciones/Unidades totales</span>
                            <span id="cart-total-portions">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span id="cart-people">Comidas para 4 persona(s )</span>
                            <span id="cart-portions">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Dias durables</span>
                            <span id="cart-durability">0</span>
                        </div>

                        <div class="flex gap-3 mt-4">
                            
                            <!-- Botón para vaciar el carrito -->
                            <button id="clear-cart" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-3 rounded-xl transition">
                                Vaciar
                            </button>
                            
                            <!-- Botón para finalizar la compra -->
                            <button id="checkout" class="flex-1 bg-green-600 hover:bg-green-500 py-3 rounded-xl font-semibold transition">
                                Confirmar pedido
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </aside>

    </div>

    <script type="module" src="/src/main.ts"></script>

</body>

</html>
